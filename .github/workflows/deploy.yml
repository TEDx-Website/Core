name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:

  publish:

    name: Publish Application

    runs-on: windows-latest

    environment: Production

    defaults:
      run:
        working-directory: TEDx-Backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TEDx.sln

      - name: Build
        run: dotnet build TEDx.sln --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish TEDx.Api/TEDx.Api.csproj `
            -c Release `
            -o publish `
            --no-build

      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: TEDx-Backend/publish