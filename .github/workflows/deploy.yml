name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy

    runs-on: ubuntu-latest

    environment: Production

    defaults:
      run:
        working-directory: TEDx-Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TEDx.sln

      - name: Build
        run: dotnet build TEDx.sln --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish TEDx.Api/TEDx.Api.csproj \
            -c Release \
            -o publish \
            --no-build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP Mirror
        run: |
          lftp -u "${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }}" sftp://${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PORT }} <<EOF
          set sftp:auto-confirm yes
          mirror -R --delete --verbose publish ${{ secrets.SFTP_REMOTE_PATH }}
          bye
          EOF