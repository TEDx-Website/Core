name: Continuous Integration (Build)

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-build:
    name: Build Solution
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TEDx-Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: TEDx-Backend/**/*.csproj

      - name: Restore
        run: dotnet restore TEDx.sln

      - name: Build
        run: dotnet build TEDx.sln --configuration Release --no-restore